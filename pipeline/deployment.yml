trigger:
  branches:
    include:
      - dev

variables:
  terraform_version: 1.6.6
  instance_count: 2
  aws_region: us-east-1

stages:
- stage: Terraform
  jobs:
  - job: TerraformApply
    displayName: 'Terraform Apply EC2 Instances'
    pool:
      vmImage: ubuntu-latest

    variables:
      - group: aws-creds  # Replace with your variable group name that includes AWS credentials

    steps:
    - checkout: self

    - script: |
        echo "Installing Terraform v$(terraform_version)..."
        wget https://releases.hashicorp.com/terraform/$(terraform_version)/terraform_$(terraform_version)_linux_amd64.zip
        unzip terraform_$(terraform_version)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform CLI'

    - script: |
        terraform init
      displayName: 'Terraform Init'

    - script: |
        terraform validate
      displayName: 'Terraform Validate'

    - script: |
        terraform plan -var="instance_count=$(instance_count)" -var="region=$(aws_region)"
      displayName: 'Terraform Plan'

    - script: |
        terraform apply -auto-approve -var="instance_count=$(instance_count)" -var="region=$(aws_region)"
      displayName: 'Terraform Apply'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
