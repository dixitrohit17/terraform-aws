trigger: none  # Manual run only

variables:
  terraform_version: 1.6.6
  aws_region: ap-south-1
  instance_count: 2  # optional, in case destroy logic depends on it

stages:
- stage: TerraformDestroy
  displayName: "Terraform Destroy Stage"
  jobs:
    - job: Destroy
      displayName: "Destroy Infrastructure"
      pool:
        name: Default  # or use 'ubuntu-latest' if using hosted agent
      variables:
        - group: aws-creds  # must contain AWS_ACCESS_KEY_ID & AWS_SECRET_ACCESS_KEY

      steps:
        - checkout: self

        - script: |
            echo "Installing Terraform v$(terraform_version)..."
            wget https://releases.hashicorp.com/terraform/$(terraform_version)/terraform_$(terraform_version)_linux_amd64.zip
            unzip terraform_$(terraform_version)_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform version
          displayName: "Install Terraform"

        - script: terraform init
          displayName: "Terraform Init"
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_REGION: $(aws_region)

        - script: terraform validate
          displayName: "Terraform Validate"
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_REGION: $(aws_region)

        - script: terraform destroy -auto-approve -var="instance_count=$(instance_count)" -var="region=$(aws_region)"
          displayName: "Terraform Destroy"
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_REGION: $(aws_region)